name: Release

# Publishes beliq-cli to npm via Trusted Publishing (OIDC) - no NPM_TOKEN
# needed. Provenance attestations are generated automatically. A release runs
# from a vX.Y.Z tag: push the tag, or dispatch the workflow on one. A dispatch
# on a branch ends the run green and publishes nothing.
#
# Prerequisite: @beliq/sdk must already be on npm, since this package depends on
# it and CI resolves it from the registry.
#
# One-time setup on npmjs.com: configure beliq-eu/beliq-cli as a Trusted
# Publisher for the beliq-cli package (package Settings -> Publishing access ->
# GitHub Actions, workflow `release.yml`, environment `release`). The first
# v0.1.0 release is bootstrapped with a local `npm publish`; every tag from then
# on flows through here with provenance.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# One release at a time, never cancelled midway: two tags pushed together would
# otherwise publish in parallel and finish in either order. GitHub keeps one
# waiting run per group, so a third tag cancels the waiting one; re-run it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC)

jobs:
  # workflow_dispatch offers every branch, so a release can be started from a
  # place that must never publish. That is a mistake, not a fault, so the run
  # ends green with a notice and nothing is published.
  #
  # Gating at job level rather than inside `publish` keeps the whole publish job
  # behind one decision, so a step added to it later cannot run on a refused
  # dispatch. It also leaves the `release` environment unrequested on a non-tag
  # ref, which is what lets the run end green at all: the environment's `v*.*.*`
  # tag policy fails any job it blocks, whatever that job's own first step does.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads nothing, publishes nothing. The npm OIDC token is minted only in
    # `publish`, inside the `release` environment.
    permissions: {}
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - name: Release only from a vX.Y.Z tag
        id: decide
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::a release runs from a vX.Y.Z tag, not from $GITHUB_REF, so nothing was published"
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest # Trusted Publishing requires a cloud-hosted runner
    timeout-minutes: 15
    # The half an edit to this file cannot remove. GitHub refuses to start the
    # job unless the ref matches this environment's `v*.*.*` tag policy, and
    # npm only accepts a Trusted Publishing token from a run in it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the guard below needs main's history

      # `gate` has settled that the ref is a vX.Y.Z tag; a tag can still point
      # at any commit, so this is the other half. It is no defence against an
      # edit to this file: a tag runs the workflow as of its commit. The
      # `release` environment above is that defence. Unlike a dispatch from a
      # branch, a tag off main is a fault worth a red run.
      - name: The tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $(git rev-parse --short HEAD), which is not on main"
            exit 1
          fi

      # No `registry-url`: it writes an `.npmrc` with a token placeholder that
      # npm would use instead of OIDC, so publish would fail with a 404. npm
      # defaults to registry.npmjs.org and uses Trusted Publishing when the
      # token-auth `.npmrc` is absent.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          # No dependency cache in a publishing job: a poisoned cache would ship.
          package-manager-cache: false

      # Trusted Publishing + automatic provenance need npm >= 11.5.1. Pinned, not
      # @latest, so a new npm release reaches a publish only through a reviewed bump.
      - name: Upgrade npm
        # renovate: datasource=npm depName=npm
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Em-dash scrub check
        run: npm run scrub:check

      - name: package.json version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./package.json').version")"
          test "$want" = "$have" || {
            echo "tag says $want, package.json says $have"
            exit 1
          }

      - name: Publish to npm
        run: npm publish
